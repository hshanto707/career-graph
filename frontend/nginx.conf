server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router routes are client-side only -- nginx has no matching file
    # for e.g. /register or /jobs, so fall back to index.html and let the
    # SPA's router take over instead of returning its default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
