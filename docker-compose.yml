# Pinned so this project's containers/volumes never collide with another
# unrelated project that also happens to have a folder with the same name as
# this repo -- without this, Compose falls back to naming everything after
# the current directory.
name: careergraph

services:
  postgres:
    image: postgres:15
    container_name: careergraph_postgres
    environment:
      POSTGRES_USER: careergraph
      POSTGRES_PASSWORD: careergraph
      POSTGRES_DB: careergraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergraph -d careergraph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: careergraph_neo4j
    environment:
      NEO4J_AUTH: neo4j/careergraph
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careergraph_api
    environment:
      DATABASE_URL: postgresql+psycopg2://careergraph:careergraph@postgres:5432/careergraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: careergraph
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-256-bit-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      # This stack's frontend is the built/nginx-served container below, on
      # port 80 (not the Vite dev server's 8080) -- CORS must match that
      # origin exactly (main.py's CORSMiddleware does an exact string
      # compare), and a browser omits ":80" from the Origin header for
      # plain HTTP, so this must be "http://localhost", not
      # "http://localhost:80".
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Same reasoning as backend/docker-compose.yml: the GNN inference
      # path (app/engine/algorithmic/gnn_recommendation_agent.py) resolves
      # the ml/ checkpoint + model.py at a repo-relative path assuming ml/
      # and backend/ are siblings, which only holds inside the container if
      # both are mounted at the paths that assumption expects.
      - ./ml:/ml:ro
      - ./backend/data:/backend/data:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careergraph_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional local LLM provider. Only started with: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    container_name: careergraph_ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  ollama_data:
