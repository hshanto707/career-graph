version: "3.9"

# Self-contained compose file for the backend/ scaffold: Postgres + Neo4j +
# the FastAPI service, plus an optional local Ollama LLM provider.
# Bring the whole stack up with: docker compose up -d

services:
  postgres:
    image: postgres:15
    container_name: careergraph_backend_postgres
    environment:
      POSTGRES_USER: careergraph
      POSTGRES_PASSWORD: careergraph
      POSTGRES_DB: careergraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergraph -d careergraph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: careergraph_backend_neo4j
    environment:
      NEO4J_AUTH: neo4j/careergraph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careergraph_backend_api
    environment:
      DATABASE_URL: postgresql+psycopg2://careergraph:careergraph@postgres:5432/careergraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: careergraph
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-real-256-bit-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # Optional local LLM provider. Only started with: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    container_name: careergraph_backend_ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
